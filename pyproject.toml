[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# B008 flags function calls in defaults — but Depends()/File()/Form()/Query()
# in endpoint signatures is idiomatic FastAPI, not a bug.
[tool.ruff.lint.per-file-ignores]
"backend/app/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
